kind: kronos-tool
apiVersion: v1

metadata:
  id: salesforce-rest-user-permissions
  version: 0.1.0
  vendor: kronos
  license: AGPL-3.0
  homepage: https://github.com/alchemisthomer/kronos
  description: >
    Enumerate a Salesforce user's effective permissions across their Profile,
    PermissionSet assignments, ObjectPermissions, and FieldPermissions. Aggregates
    into effective-access rollups and detects 13 classes of authorization
    anomalies (permission escalation, data-exfil primitives, admin-on-non-admin,
    stale-credential, orphaned-identity). Read-only. Requires "Manage Users" or
    "View Setup and Configuration" for cross-user introspection.

capabilities:
  attack_classes:
    - id: recon.enumeration.salesforce.user-authorization-envelope
      subclasses:
        - profile-permission-enumeration
        - permissionset-assignment-enumeration
        - object-permission-aggregation
        - field-permission-aggregation
        - permission-escalation-primitive-detection
        - data-exfil-primitive-detection
  api_family: salesforce.rest
  endpoint: /services/data/v{{apiVersion}}/query
  sobjects_queried:
    - User
    - Profile
    - PermissionSet
    - PermissionSetAssignment
    - ObjectPermissions
    - FieldPermissions
  evidence_types:
    - user-csv
    - profile-csv
    - permissionset-assignments-csv
    - permissionsets-detail-csv
    - object-permissions-csv
    - field-permissions-csv
    - analysis-json
    - analysis-markdown
    - run-manifest
  protocols_supported: [https]

invocation:
  binding_layer: 1
  adapter: ./src/index.ts
  invocation_type: subprocess
  runtime: node
  entry_command: ["npx", "tsx", "src/index.ts"]
  timeout_seconds: 300

  argv:
    - name: user-id
      type: string
      required: true
      description: Target Salesforce user Id (15 or 18 chars, starts with 005).
    - name: credentials
      type: path
      required: false
      default: "../salesforce-rest-query-csv/credentials/salesforce.json"
    - name: login-url
      type: string
      required: false
      default: "https://login.salesforce.com"
    - name: api-version
      type: string
      required: false
      default: "64.0"
    - name: output-dir
      type: path
      required: false
      default: "./output"
    - name: analysis-json
      type: path
      required: false
      default: "<output-dir>/user-<slug>-permissions-analysis.json"
    - name: analysis-md
      type: path
      required: false
      default: "<output-dir>/user-<slug>-permissions-analysis.md"

  outputs:
    - name: user-record
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: profile-record
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: permissionset-assignments
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: permissionsets-detail
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: object-permissions
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: field-permissions
      format: csv
      channel: file
      hash_algorithm: sha256
    - name: analysis-json
      format: json
      channel: file
      hash_algorithm: sha256
    - name: analysis-markdown
      format: markdown
      channel: file
      hash_algorithm: sha256
    - name: run-manifest
      format: json
      channel: stdout
      hash_algorithm: sha256

authorization:
  requires_network:
    - "{{argv.login-url}}"
    - "*.salesforce.com"
    - "*.force.com"
    - "*.my.salesforce.com"
  requires_credentials: true
  requires_elevated_privilege: false     # tool doesn't require it; target-side may
  destructive_testing: false
  authorization_ceiling_max: 2

data_class:
  # Permissions metadata is confidential — reveals the org's authorization
  # design surface. Not PII in the strict sense; sensitive under SOC 2 /
  # ISO 27001 / most privacy frameworks. Treat exports as CONFIDENTIAL.
  resource_classes_affected:
    - salesforce.authorization-metadata
    - salesforce.user-identity
    - salesforce.permissionset-inventory
    - salesforce.field-permission-inventory

sandbox:
  recommended: process
  container_image: null
  network_restrictions:
    - allowlist:
        - "*.salesforce.com"
        - "*.force.com"
        - "*.my.salesforce.com"
  resource_limits:
    memory_mb: 512
    cpu_cores: 1

credentials:
  file_credentials_permitted: true
  env_variables_permitted: true
  env_variables_expected:
    - KRONOS_SF_USERNAME
    - KRONOS_SF_PASSWORD
    - KRONOS_SF_SECURITY_TOKEN
    - KRONOS_SF_LOGIN_URL
  credential_leakage_audit: true

conformance:
  golden_target_verified: false
  last_verified_at: null

runtime:
  language: typescript
  node_engine: ">=22.0.0"
  package_dependencies:
    - jsforce@^3

related_tools:
  - salesforce-rest-query-csv:0.1.0             # underlying /query primitive
  - salesforce-rest-sobjects-describe:0.1.0     # authoritative sobject metadata
  - salesforce-reverse-data-loader:0.1.0        # sibling: what the user CAN pull
  - salesforce-rest-user-loginhistory:0.1.0     # sibling: how/when the user authenticates
