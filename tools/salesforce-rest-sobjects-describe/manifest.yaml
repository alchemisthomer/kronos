kind: kronos-tool
apiVersion: v1

metadata:
  id: salesforce-rest-sobjects-describe
  version: 0.1.0
  vendor: kronos
  license: AGPL-3.0
  homepage: https://github.com/alchemisthomer/kronos
  description: >
    Fetch authoritative field/metadata description for one Salesforce sobject
    via /services/data/v{ver}/sobjects/{name}/describe. Ground truth for
    field enumeration; the definitive answer to "what fields, relationships,
    and record types exist on this sobject". Feeds any tool or oracle that
    needs the complete accessible field set for a target user.

capabilities:
  attack_classes:
    - id: recon.enumeration.salesforce.sobject-metadata
      subclasses:
        - field-enumeration
        - relationship-enumeration
        - record-type-enumeration
        - per-field-permission-inspection
  api_family: salesforce.rest
  endpoint: /services/data/v{{apiVersion}}/sobjects/{sobject}/describe
  evidence_types:
    - describe-json
    - fields-list-text
    - run-manifest
  protocols_supported: [https]

invocation:
  binding_layer: 1
  adapter: ./src/index.ts
  invocation_type: subprocess
  runtime: node
  entry_command: ["npx", "tsx", "src/index.ts"]
  timeout_seconds: 120

  argv:
    - name: sobject
      type: string
      required: true
      description: SObject API name (Account, Contact, MyCustom__c, etc.)
    - name: output
      type: path
      required: false
      default: "<output-dir>/<sobject-lower>-describe.json"
    - name: fields-out
      type: path
      required: false
      default: null
      description: Optional path; writes sorted field-name list (one per line).
    - name: output-dir
      type: path
      required: false
      default: "./output"
    - name: credentials
      type: path
      required: false
      default: "../salesforce-rest-query-csv/credentials/salesforce.json"
    - name: login-url
      type: string
      required: false
      default: "https://login.salesforce.com"
    - name: api-version
      type: string
      required: false
      default: "64.0"

  outputs:
    - name: describe-json
      format: json
      channel: file
      hash_algorithm: sha256
    - name: fields-list
      format: text
      channel: file
      hash_algorithm: sha256
    - name: run-manifest
      format: json
      channel: stdout
      hash_algorithm: sha256

authorization:
  requires_network:
    - "{{argv.login-url}}"
    - "*.salesforce.com"
    - "*.force.com"
    - "*.my.salesforce.com"
  requires_credentials: true
  requires_elevated_privilege: false
  destructive_testing: false
  authorization_ceiling_max: 2

data_class:
  # Sobject metadata is not PII but reveals the customer's schema surface —
  # customizations, field names, relationships. Sensitive under NDA.
  resource_classes_affected:
    - salesforce.sobject-metadata
    - salesforce.field-catalog

sandbox:
  recommended: process
  container_image: null
  network_restrictions:
    - allowlist:
        - "*.salesforce.com"
        - "*.force.com"
        - "*.my.salesforce.com"
  resource_limits:
    memory_mb: 256
    cpu_cores: 1

credentials:
  file_credentials_permitted: true
  env_variables_permitted: true
  env_variables_expected:
    - KRONOS_SF_USERNAME
    - KRONOS_SF_PASSWORD
    - KRONOS_SF_SECURITY_TOKEN
    - KRONOS_SF_LOGIN_URL
  credential_leakage_audit: true

conformance:
  golden_target_verified: false
  last_verified_at: null

runtime:
  language: typescript
  node_engine: ">=22.0.0"
  package_dependencies:
    - jsforce@^3

related_tools:
  - salesforce-rest-query-csv:0.1.0
