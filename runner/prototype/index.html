<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kronos · Executive Assurance Console</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg: #fafbfc;
  --bg-elev: #ffffff;
  --bg-sunk: #f3f5f7;
  --bg-hero: #0f172a;
  --bg-hero-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #4c1d95 100%);
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #0f172a;
  --text-2: #334155;
  --text-3: #64748b;
  --text-4: #94a3b8;
  --text-on-dark: #f8fafc;
  --text-on-dark-2: #cbd5e1;
  --text-on-dark-3: #94a3b8;
  --accent: #7c3aed;
  --accent-2: #6366f1;
  --accent-3: #a78bfa;
  --accent-dim: #ddd6fe;
  --info: #2563eb;
  --info-dim: #dbeafe;
  --ok: #10b981;
  --ok-dim: #d1fae5;
  --warn: #f59e0b;
  --warn-dim: #fef3c7;
  --danger: #ef4444;
  --danger-dim: #fee2e2;
  --crit: #b91c1c;
  --crit-dim: #fecaca;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, monospace;
}

/* ═══════════════════════════════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ═══════════════════════════════════════════════════════════════════════
   TOP NAV
   ═══════════════════════════════════════════════════════════════════════ */
.topnav {
  background: var(--bg-hero-grad);
  color: var(--text-on-dark);
  padding: 14px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  box-shadow: var(--shadow-lg);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topnav .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.topnav .brand-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
  border-radius: 8px;
  display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(167, 139, 250, 0.35);
  font-weight: 800; font-size: 15px;
}
.topnav .brand-mark::after { content: "κ"; color: white; font-family: Georgia, serif; }
.topnav .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.topnav .brand-sub { color: var(--text-on-dark-2); font-size: 13px; font-weight: 400; margin-left: 4px; }
.topnav .breadcrumb { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 13px; color: var(--text-on-dark-2); }
.topnav .breadcrumb .crumb { cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: background 0.15s; }
.topnav .breadcrumb .crumb:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-on-dark); }
.topnav .breadcrumb .crumb.current { color: var(--text-on-dark); font-weight: 500; }
.topnav .breadcrumb .sep { color: var(--text-on-dark-3); }
.topnav .meta { color: var(--text-on-dark-3); font-size: 12px; font-family: var(--font-mono); }
.topnav .actions { display: flex; gap: 8px; align-items: center; }
.topnav .btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-on-dark);
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s;
}
.topnav .btn:hover { background: rgba(255, 255, 255, 0.12); }

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
.page { max-width: 1360px; margin: 0 auto; padding: 32px 40px 80px; }

/* ═══════════════════════════════════════════════════════════════════════
   HERO — HOME VIEW
   ═══════════════════════════════════════════════════════════════════════ */
.hero {
  background: var(--bg-hero-grad);
  border-radius: var(--radius-xl);
  padding: 40px 44px 44px;
  color: var(--text-on-dark);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-xl);
  margin-bottom: 32px;
}
.hero::before {
  content: "";
  position: absolute;
  top: -80px; right: -80px;
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(167, 139, 250, 0.35) 0%, transparent 65%);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute;
  bottom: -100px; left: -100px;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 65%);
  pointer-events: none;
}
.hero-content { position: relative; z-index: 1; }
.hero-eyebrow { color: var(--text-on-dark-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
.hero-title { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.05; }
.hero-title .accent { background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { color: var(--text-on-dark-2); font-size: 17px; margin-top: 12px; max-width: 720px; line-height: 1.5; }
.hero-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 32px; }
.hero-kpi {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius);
  padding: 18px 20px;
  backdrop-filter: blur(6px);
}
.hero-kpi .label { color: var(--text-on-dark-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.hero-kpi .value { font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; line-height: 1; }
.hero-kpi .value .unit { font-size: 15px; color: var(--text-on-dark-2); font-weight: 500; margin-left: 4px; }
.hero-kpi .trend { color: var(--text-on-dark-3); font-size: 12px; margin-top: 6px; font-weight: 500; }
.hero-kpi .trend.up { color: #86efac; }
.hero-kpi .trend.down { color: #fca5a5; }

/* ═══════════════════════════════════════════════════════════════════════
   SECTIONS
   ═══════════════════════════════════════════════════════════════════════ */
.section { margin-bottom: 44px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.section-sub { color: var(--text-3); font-size: 14px; margin-top: 4px; }
.section-badge { background: var(--bg-sunk); color: var(--text-3); padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════════════
   BULLETINS — "THINGS THE CEO NEEDS TO KNOW"
   ═══════════════════════════════════════════════════════════════════════ */
.bulletin-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  box-shadow: var(--shadow-md);
}
.bulletin-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.bulletin-card h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.bulletin-card .head .badge { background: var(--accent-dim); color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.bulletin { display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); }
.bulletin:first-of-type { border-top: 1px solid transparent; padding-top: 4px; }
.bulletin .marker {
  width: 6px;
  border-radius: 3px;
  flex-shrink: 0;
  min-height: 100%;
}
.bulletin.crit .marker { background: linear-gradient(180deg, var(--crit), var(--danger)); }
.bulletin.high .marker { background: linear-gradient(180deg, var(--danger), #fb7185); }
.bulletin.med .marker { background: var(--warn); }
.bulletin.low .marker { background: var(--info); }
.bulletin.ok .marker { background: var(--ok); }
.bulletin .body { flex: 1; }
.bulletin .kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.bulletin .kicker .pill { text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; font-weight: 700; padding: 2px 7px; border-radius: 4px; color: white; }
.bulletin.crit .pill { background: var(--crit); }
.bulletin.high .pill { background: var(--danger); }
.bulletin.med .pill { background: var(--warn); }
.bulletin.low .pill { background: var(--info); }
.bulletin.ok .pill { background: var(--ok); }
.bulletin .kicker .source { color: var(--text-3); font-size: 12px; }
.bulletin .headline { font-size: 15px; font-weight: 500; line-height: 1.45; color: var(--text); }
.bulletin .detail { color: var(--text-2); font-size: 13.5px; margin-top: 4px; }

/* ═══════════════════════════════════════════════════════════════════════
   PORTFOLIO GRID — ENGAGEMENT CARDS
   ═══════════════════════════════════════════════════════════════════════ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
.engagement-card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 260px;
}
.engagement-card:hover { box-shadow: var(--shadow-xl); transform: translateY(-2px); border-color: var(--accent-3); }
.engagement-card .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.engagement-card .card-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.engagement-card .card-sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.engagement-card .theme { color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
.engagement-card .findings-bar { display: flex; align-items: center; gap: 4px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg-sunk); }
.engagement-card .findings-bar > div { height: 100%; }
.engagement-card .findings-bar .crit { background: var(--crit); }
.engagement-card .findings-bar .high { background: var(--danger); }
.engagement-card .findings-bar .med { background: var(--warn); }
.engagement-card .findings-bar .low { background: var(--info); }
.engagement-card .findings-legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-3); margin-top: 4px; }
.engagement-card .findings-legend .count-crit { color: var(--crit); font-weight: 600; }
.engagement-card .findings-legend .count-high { color: var(--danger); font-weight: 600; }
.engagement-card .findings-legend .count-med { color: var(--warn); font-weight: 600; }
.engagement-card .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.engagement-card .metric { display: flex; gap: 16px; font-size: 12px; color: var(--text-3); }
.engagement-card .metric strong { color: var(--text); font-weight: 600; }

/* ═══════════════════════════════════════════════════════════════════════
   STATUS BADGES
   ═══════════════════════════════════════════════════════════════════════ */
.badge-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
.badge-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
.status-scoped     { background: var(--bg-sunk); color: var(--text-2); }        .status-scoped::before     { background: var(--text-3); }
.status-authorized { background: var(--info-dim); color: var(--info); }         .status-authorized::before { background: var(--info); }
.status-planning   { background: var(--info-dim); color: var(--info); }         .status-planning::before   { background: var(--info); }
.status-ready      { background: var(--accent-dim); color: var(--accent); }     .status-ready::before      { background: var(--accent); }
.status-running    { background: var(--warn-dim); color: #b45309; }             .status-running::before    { background: var(--warn); animation: pulse 2s infinite; }
.status-evidence   { background: var(--warn-dim); color: #b45309; }             .status-evidence::before   { background: var(--warn); }
.status-shipped    { background: var(--ok-dim); color: #065f46; }               .status-shipped::before    { background: var(--ok); }
.status-aborted    { background: var(--danger-dim); color: var(--danger); }     .status-aborted::before    { background: var(--danger); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.pill.crit { background: var(--crit-dim); color: var(--crit); }
.pill.high { background: var(--danger-dim); color: var(--danger); }
.pill.med { background: var(--warn-dim); color: #b45309; }
.pill.low { background: var(--info-dim); color: var(--info); }
.pill.ok { background: var(--ok-dim); color: #065f46; }
.pill.neutral { background: var(--bg-sunk); color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════════════
   ENGAGEMENT DETAIL VIEW
   ═══════════════════════════════════════════════════════════════════════ */
.detail-hero {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 36px 40px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.detail-hero::before {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 200px; height: 200px;
  background: radial-gradient(circle at top right, var(--accent-dim) 0%, transparent 70%);
  pointer-events: none;
}
.detail-hero-content { position: relative; }
.detail-hero .eyebrow { color: var(--text-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.detail-hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.detail-hero .theme { color: var(--text-2); font-size: 16px; margin-top: 12px; max-width: 720px; line-height: 1.5; }
.detail-hero .meta-row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
.detail-hero .meta-row .item { }
.detail-hero .meta-row .item .label { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.detail-hero .meta-row .item .value { font-size: 14px; font-weight: 500; margin-top: 2px; }
.detail-hero .meta-row .item .value.mono { font-family: var(--font-mono); font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════════════
   PANELS + CARDS
   ═══════════════════════════════════════════════════════════════════════ */
.panel {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.panel h3 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 14px; }
.panel h3 .count { color: var(--text-4); font-weight: 500; margin-left: 4px; text-transform: none; letter-spacing: 0; }
.two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

/* Executive summary panel */
.summary-panel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.summary-panel h3 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 12px; }
.summary-panel .prose { font-size: 15px; color: var(--text-2); line-height: 1.65; }
.summary-panel .prose p { margin-bottom: 10px; }
.summary-panel .prose p:last-child { margin-bottom: 0; }

.takeaway {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border: 1px solid var(--warn);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.takeaway.crit { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-color: var(--crit); }
.takeaway.ok { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-color: var(--ok); }
.takeaway .icon { font-size: 24px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.takeaway .body h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 4px; }
.takeaway .body p { font-size: 15.5px; color: var(--text); font-weight: 500; line-height: 1.5; }

/* ═══════════════════════════════════════════════════════════════════════
   FINDINGS SUMMARY
   ═══════════════════════════════════════════════════════════════════════ */
.findings-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.findings-summary .card {
  background: var(--bg-sunk);
  border-radius: var(--radius);
  padding: 16px 18px;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.findings-summary .card .count { font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.findings-summary .card .label { color: var(--text-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.findings-summary .card.crit { background: var(--crit-dim); }
.findings-summary .card.crit .count { color: var(--crit); }
.findings-summary .card.high { background: var(--danger-dim); }
.findings-summary .card.high .count { color: var(--danger); }
.findings-summary .card.med { background: var(--warn-dim); }
.findings-summary .card.med .count { color: #b45309; }
.findings-summary .card.low { background: var(--info-dim); }
.findings-summary .card.low .count { color: var(--info); }
.findings-summary .card.total { background: var(--bg-hero); color: var(--text-on-dark); }
.findings-summary .card.total .count { color: white; }
.findings-summary .card.total .label { color: var(--text-on-dark-3); }

/* ═══════════════════════════════════════════════════════════════════════
   SCORECARD HEATMAP
   ═══════════════════════════════════════════════════════════════════════ */
.scorecard { }
.scorecard-pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.scorecard-pillar {
  background: var(--bg-sunk);
  border-radius: var(--radius);
  padding: 16px;
}
.scorecard-pillar h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: var(--text-3); margin-bottom: 12px; }
.dim-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 12px; }
.dim-row + .dim-row { border-top: 1px solid var(--border); }
.dim-row .name { color: var(--text); font-weight: 500; }
.dim-row .level {
  min-width: 30px; text-align: center; padding: 3px 6px; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 11px;
}
.level-L0 { background: var(--danger-dim); color: var(--danger); }
.level-L1 { background: #ffedd5; color: #c2410c; }
.level-L2 { background: var(--warn-dim); color: #b45309; }
.level-L3 { background: var(--info-dim); color: var(--info); }
.level-L4 { background: var(--ok-dim); color: #065f46; }
.level-L5 { background: linear-gradient(135deg, var(--ok-dim), var(--accent-dim)); color: var(--accent); }
.dim-row .arrow { font-size: 11px; color: var(--text-3); }
.dim-row .arrow.up { color: var(--ok); }
.dim-row .arrow.down { color: var(--danger); }

/* ═══════════════════════════════════════════════════════════════════════
   SCENARIO ROW LIST
   ═══════════════════════════════════════════════════════════════════════ */
.scenario-list { display: flex; flex-direction: column; gap: 10px; }
.scenario-row {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 20px;
  align-items: center;
}
.scenario-row:hover { border-color: var(--accent-3); box-shadow: var(--shadow-md); transform: translateX(2px); }
.scenario-row .verdict-badge {
  min-width: 90px; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
  text-align: center; text-transform: uppercase; letter-spacing: 0.06em;
}
.scenario-row .verdict-badge.confirmed { background: var(--crit-dim); color: var(--crit); }
.scenario-row .verdict-badge.high { background: var(--danger-dim); color: var(--danger); }
.scenario-row .verdict-badge.medium { background: var(--warn-dim); color: #b45309; }
.scenario-row .verdict-badge.low { background: var(--info-dim); color: var(--info); }
.scenario-row .verdict-badge.clean { background: var(--ok-dim); color: #065f46; }
.scenario-row .verdict-badge.inconclusive { background: var(--bg-sunk); color: var(--text-3); }
.scenario-row .body h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px; }
.scenario-row .body .meta { font-size: 12.5px; color: var(--text-3); font-family: var(--font-mono); }
.scenario-row .arrow { color: var(--text-4); font-size: 20px; }

/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════ */
.finding-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 12px;
  background: var(--bg-elev);
  border-left-width: 4px;
}
.finding-card.crit { border-left-color: var(--crit); }
.finding-card.high { border-left-color: var(--danger); }
.finding-card.med { border-left-color: var(--warn); }
.finding-card.low { border-left-color: var(--info); }
.finding-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.finding-card .head h4 { font-family: var(--font-mono); font-size: 13px; color: var(--accent); font-weight: 700; }
.finding-card .detail { color: var(--text); font-size: 14px; }
.finding-card .evidence { margin-top: 10px; }
.finding-card .evidence pre { background: var(--bg-sunk); padding: 12px; border-radius: 6px; font-family: var(--font-mono); font-size: 11.5px; overflow-x: auto; color: var(--text-2); }

.artifact-list { display: flex; flex-direction: column; gap: 8px; }
.artifact-row {
  background: var(--bg-sunk);
  border-radius: 8px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  gap: 16px;
  align-items: center;
  font-size: 13px;
}
.artifact-row .kind { font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--bg-elev); color: var(--text-2); font-weight: 600; }
.artifact-row .path { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artifact-row .size { color: var(--text-3); font-size: 12px; font-family: var(--font-mono); }
.artifact-row .hash { color: var(--text-4); font-size: 11px; font-family: var(--font-mono); }

/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════ */
.md { color: var(--text-2); font-size: 14.5px; line-height: 1.65; }
.md h1, .md h2, .md h3, .md h4 { color: var(--text); margin-top: 20px; margin-bottom: 8px; line-height: 1.25; letter-spacing: -0.01em; }

.md h2 { font-size: 19px; font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

.md h4 { font-size: 14px; font-weight: 700; }

.md li { margin: 4px 0; }

.md pre { background: var(--bg-sunk); padding: 14px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
.md pre code { background: transparent; padding: 0; color: var(--text); font-size: 12.5px; }
.md blockquote { border-left: 3px solid var(--accent-3); padding: 4px 12px; color: var(--text-3); font-style: italic; margin: 10px 0; }

.md th, .md td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
.md th { background: var(--bg-sunk); font-weight: 600; color: var(--text); }
.md strong { color: var(--text); font-weight: 600; }

/* ═══════════════════════════════════════════════════════════════════════
   STATE + ROUTING
   ═══════════════════════════════════════════════════════════════════════ */
const STATE = {
  view: 'home',
  engagementId: null,
  scenarioId: null,
};

function parseHash() {
  const h = window.location.hash.slice(1);
  if (!h || h === '/') return { view: 'home' };
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'e' && parts[1] && parts[2] === 's' && parts[3]) {
    return { view: 'scenario', engagementId: parts[1], scenarioId: parts[3] };
  }
  if (parts[0] === 'e' && parts[1]) {
    return { view: 'engagement', engagementId: parts[1] };
  }
  return { view: 'home' };
}

function navigate(path) {
  window.location.hash = path.replace(/^#/, '');
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);

/* ═══════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(1) + ' GB';
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function findingsTotal(f) { return (f.critical || 0) + (f.high || 0) + (f.medium || 0) + (f.low || 0); }
function severityKey(s) { return { critical: 'crit', crit: 'crit', high: 'high', medium: 'med', med: 'med', low: 'low', ok: 'ok' }[s] || 'neutral'; }

/* ═══════════════════════════════════════════════════════════════════════
   BREADCRUMB
   ═══════════════════════════════════════════════════════════════════════ */
function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const parsed = parseHash();
  let html = '<span class="crumb" onclick="navigate(\'#/\')">Portfolio</span>';
  if (parsed.view === 'engagement' || parsed.view === 'scenario') {
    const eng = KRONOS_DATA.engagements.find((e) => e.id === parsed.engagementId);
    if (eng) {
      html += '<span class="sep">/</span>';
      html += `<span class="crumb ${parsed.view === 'engagement' ? 'current' : ''}" onclick="navigate('#/e/${esc(eng.id)}')">${esc(eng.target_display)}</span>`;
      if (parsed.view === 'scenario') {
        const sc = eng.scenarios.find((s) => s.id === parsed.scenarioId);
        if (sc) {
          html += '<span class="sep">/</span>';
          html += `<span class="crumb current">${esc(sc.id)}: ${esc(sc.name.slice(0, 60))}${sc.name.length > 60 ? '…' : ''}</span>`;
        }
      }
    }
  }
  el.innerHTML = html;
}

function renderEngagementCard(e) {

  const highPct = total ? (e.findings_summary.high / total * 100) : 0;
  const medPct  = total ? (e.findings_summary.medium / total * 100) : 0;
  const lowPct  = total ? (e.findings_summary.low / total * 100) : 0;
  return `
    <div class="engagement-card" onclick="navigate('#/e/${esc(e.id)}')">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(e.target_display)}</div>
          <div class="card-sub">${esc(e.target_platform)}</div>
        </div>
        <span class="badge-status status-${esc(e.status)}">${esc(e.status)}</span>
      </div>
      <div class="theme">${esc(e.theme)}</div>
      ${total > 0 ? `
        <div>
          <div class="findings-bar">
            ${critPct ? `<div class="crit" style="width:${critPct}%"></div>` : ''}
            ${highPct ? `<div class="high" style="width:${highPct}%"></div>` : ''}
            ${medPct ? `<div class="med" style="width:${medPct}%"></div>` : ''}
            ${lowPct ? `<div class="low" style="width:${lowPct}%"></div>` : ''}

          <div class="findings-legend">
            ${e.findings_summary.critical ? `<span class="count-crit">${e.findings_summary.critical} critical</span>` : ''}
            ${e.findings_summary.high ? `<span class="count-high">${e.findings_summary.high} high</span>` : ''}
            ${e.findings_summary.medium ? `<span class="count-med">${e.findings_summary.medium} medium</span>` : ''}
            ${e.findings_summary.low ? `<span>${e.findings_summary.low} low</span>` : ''}

        </div>
      ` : `
        <div>
          <div class="findings-bar"><div class="ok" style="width:100%;background:var(--ok)"></div></div>
          <div class="findings-legend"><span style="color: var(--ok); font-weight: 600;">Clean — no findings surfaced</span></div>

      <div class="card-footer">
        <div class="metric">
          <div><strong>${e.scenarios.length}</strong> scenarios</div>

/* ═══════════════════════════════════════════════════════════════════════

function renderScorecardPillar(title, dims) {
  return `
    <div class="scorecard-pillar">
      <h4>${esc(title)}</h4>
      ${Object.entries(dims).map(([dim, val]) => {
        const before = val.before;
        const after = val.after;
        const dirn = before === after ? '=' : (after > before ? '↑' : '↓');
        const dirClass = before === after ? '' : (after > before ? 'up' : 'down');
        return `
          <div class="dim-row">
            <span class="name">${esc(dim.replace(/_/g, ' '))}</span>
            <span class="level level-${esc(after)}">${esc(after)}</span>
            <span class="arrow ${dirClass}">${dirn}${before === after ? '' : ' from ' + esc(before)}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

          <div class="prose"><p>${esc(s.oracle_verdict)}</p></div>
        </div>

          ${s.findings.length === 0 ? '<div style="color:var(--text-3);font-style:italic">No findings from this scenario — verdict is clean.</div>' :

        <div class="panel">

              </div>
            `).join('')}</div>`
          }
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════
   RENDER DISPATCH
   ═══════════════════════════════════════════════════════════════════════ */
function render() {
  const parsed = parseHash();
  Object.assign(STATE, parsed);
  const page = document.getElementById('page');
  document.getElementById('asof-display').textContent = `as of ${fmtDate(KRONOS_DATA.as_of)}`;
  renderBreadcrumb();
  if (parsed.view === 'engagement') { page.innerHTML = renderEngagement(parsed.engagementId); }
  else if (parsed.view === 'scenario') { page.innerHTML = renderScenario(parsed.engagementId, parsed.scenarioId); }
  else { page.innerHTML = renderHome(); }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.getElementById('export-btn').addEventListener('click', () => {
  window.print();
});
