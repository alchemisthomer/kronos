<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kronos · Executive Assurance Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN TOKENS — companion to alchemisthomer/eos
   Same palette, same type. Kronos is the attack; EOS is the attestation.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg:          #06060a;
  --bg-header:   #0a0a10;
  --bg-elev:     #11111a;
  --bg-card:     #1a1a24;
  --bg-sunk:     #0d0d14;
  --fg:          #e8e4dc;
  --fg-dim:      #9ca3af;
  --fg-faint:    #6b7280;
  --fg-veil:     #4b5563;
  --gold:        #fcd34d;
  --gold-dim:    #78632a;
  --emerald:     #34d399;
  --emerald-dim: #14663f;
  --rose:        #ef4444;
  --rose-dim:    #7f1d1d;
  --crimson:     #b91c1c;
  --amber:       #f59e0b;
  --amber-dim:   #6b3f0a;
  --sapphire:    #60a5fa;
  --sapphire-dim: #1e3a5f;
  --rule:        #1f1f29;
  --rule-strong: #2d2d3a;
  --shadow:      0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg:   0 8px 24px rgba(0, 0, 0, 0.5);
  --font-serif:  'Cinzel', 'Trajan Pro', 'Cormorant Garamond', Georgia, serif;
  --font-mono:   'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* ═══════════════════════════════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.6;
  min-height: 100vh;
  font-weight: 400;
}
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: none; }
button:focus, input:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-color: var(--rule-strong); }
code { font-family: inherit; background: var(--bg-elev); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 2px; color: var(--gold); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); }

.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }

/* ═══════════════════════════════════════════════════════════════════════
   TOP NAV — mirrors EOS header
   ═══════════════════════════════════════════════════════════════════════ */
.topnav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg-header);
  position: sticky; top: 0; z-index: 100;
}
.topnav .brand {
  display: flex; align-items: baseline; gap: 12px; cursor: pointer;
  color: var(--gold); font-family: var(--font-serif); font-size: 22px;
  letter-spacing: 2px; font-weight: 600;
}
.topnav .brand:hover { text-decoration: none; }
.topnav .brand-sub {
  color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.5px; font-weight: 400;
}
.topnav .breadcrumb {
  flex: 1; display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--fg-dim); font-family: var(--font-mono);
  margin: 0 24px;
}
.topnav .crumb {
  padding: 4px 10px; border-radius: 2px;
  border: 1px solid transparent;
  color: var(--fg-dim); transition: color 0.15s, border-color 0.15s;
}
.topnav .crumb:hover { color: var(--gold); border-color: var(--rule-strong); }
.topnav .crumb.current { color: var(--fg); }
.topnav .sep { color: var(--fg-veil); }
.topnav .meta {
  color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.5px;
}
.topnav .actions { display: flex; gap: 10px; align-items: center; }
.topnav .btn {
  border: 1px solid var(--rule-strong); color: var(--fg-dim);
  padding: 5px 12px; border-radius: 4px; font-size: 11px;
  letter-spacing: 0.5px; text-transform: uppercase;
  transition: color 0.15s, border-color 0.15s;
}
.topnav .btn:hover { color: var(--gold); border-color: var(--gold-dim); }

/* ═══════════════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
.page { max-width: 1360px; margin: 0 auto; padding: 32px 40px 80px; }

.section { margin-bottom: 44px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.section-title { font-family: var(--font-serif); font-size: 20px; color: var(--gold); letter-spacing: 2px; font-weight: 600; }
.section-sub { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
.section-badge {
  color: var(--fg-faint); font-size: 11px; padding: 3px 10px;
  border: 1px solid var(--rule); border-radius: 2px;
}

/* ═══════════════════════════════════════════════════════════════════════
   HERO — HOME
   ═══════════════════════════════════════════════════════════════════════ */
.hero {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 44px 48px 48px;
  position: relative;
  overflow: hidden;
  margin-bottom: 32px;
  box-shadow: var(--shadow-lg);
}
.hero::before {
  content: ""; position: absolute;
  top: -140px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(252, 211, 77, 0.08) 0%, transparent 60%);
  pointer-events: none;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(252, 211, 77, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(252, 211, 77, 0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.hero-content { position: relative; z-index: 1; }
.hero-eyebrow {
  color: var(--gold); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase; font-weight: 500;
}
.hero-title {
  font-family: var(--font-serif); font-size: 52px; color: var(--fg);
  letter-spacing: 3px; font-weight: 700; margin-top: 12px; line-height: 1.1;
}
.hero-title .accent { color: var(--gold); font-style: italic; }
.hero-sub {
  color: var(--fg-dim); font-family: var(--font-mono); font-size: 14px;
  margin-top: 16px; max-width: 640px; line-height: 1.7;
}
.hero-kpis {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 36px;
}
.hero-kpi {
  border: 1px solid var(--rule-strong);
  background: var(--bg-sunk);
  padding: 20px;
}
.hero-kpi .label {
  color: var(--fg-faint); font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
}
.hero-kpi .value {
  font-family: var(--font-serif); font-size: 36px; color: var(--gold);
  font-weight: 700; margin-top: 8px; letter-spacing: 1px; line-height: 1;
}
.hero-kpi .value .unit {
  color: var(--fg-dim); font-family: var(--font-mono); font-size: 12px;
  font-weight: 400; letter-spacing: 0; margin-left: 6px;
}
.hero-kpi .trend {
  color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px;
  margin-top: 8px; letter-spacing: 0.5px;
}
.hero-kpi .trend.up { color: var(--emerald); }
.hero-kpi .trend.down { color: var(--rose); }

/* ═══════════════════════════════════════════════════════════════════════
   BULLETINS — "WHAT YOU NEED TO KNOW"
   ═══════════════════════════════════════════════════════════════════════ */
.bulletin-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 32px 36px;
  box-shadow: var(--shadow);
}
.bulletin-card .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.bulletin-card h2 { font-family: var(--font-serif); font-size: 22px; color: var(--gold); letter-spacing: 2px; font-weight: 600; }
.bulletin-card .head .badge { color: var(--fg-faint); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.bulletin { display: flex; gap: 20px; padding: 18px 0; border-top: 1px solid var(--rule); }
.bulletin:first-of-type { border-top: none; padding-top: 4px; }
.bulletin .marker { width: 3px; flex-shrink: 0; min-height: 100%; border-radius: 2px; }
.bulletin.crit .marker { background: var(--rose); }
.bulletin.high .marker { background: var(--amber); }
.bulletin.med .marker { background: var(--gold); }
.bulletin.low .marker { background: var(--sapphire); }
.bulletin.ok .marker { background: var(--emerald); }
.bulletin .body { flex: 1; }
.bulletin .kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.bulletin .pill {
  text-transform: uppercase; font-size: 9px; letter-spacing: 1.5px; font-weight: 700;
  padding: 3px 8px; border: 1px solid; border-radius: 2px;
}
.bulletin.crit .pill { color: var(--rose); border-color: var(--rose-dim); }
.bulletin.high .pill { color: var(--amber); border-color: var(--amber-dim); }
.bulletin.med .pill { color: var(--gold); border-color: var(--gold-dim); }
.bulletin.low .pill { color: var(--sapphire); border-color: var(--sapphire-dim); }
.bulletin.ok .pill { color: var(--emerald); border-color: var(--emerald-dim); }
.bulletin .source { color: var(--fg-faint); font-size: 11px; letter-spacing: 0.5px; }
.bulletin .headline { color: var(--fg); font-size: 14px; font-weight: 500; line-height: 1.55; }
.bulletin .detail { color: var(--fg-dim); font-size: 12.5px; margin-top: 6px; line-height: 1.7; }

/* ═══════════════════════════════════════════════════════════════════════
   PORTFOLIO — engagement cards
   ═══════════════════════════════════════════════════════════════════════ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
.engagement-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 24px 26px;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  display: flex; flex-direction: column; gap: 16px;
  min-height: 260px;
  box-shadow: var(--shadow);
}
.engagement-card:hover {
  border-color: var(--gold-dim);
  box-shadow: var(--shadow-lg), 0 0 0 1px var(--gold-dim);
  transform: translateY(-2px);
}
.engagement-card .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.engagement-card .card-title {
  font-family: var(--font-serif); font-size: 18px; color: var(--fg);
  letter-spacing: 1px; font-weight: 700; line-height: 1.25;
}
.engagement-card .card-sub { color: var(--fg-dim); font-family: var(--font-mono); font-size: 11px; margin-top: 4px; letter-spacing: 0.5px; }
.engagement-card .theme { color: var(--fg-dim); font-size: 12.5px; line-height: 1.6; }
.engagement-card .findings-bar { display: flex; gap: 2px; height: 6px; background: var(--bg-sunk); border-radius: 1px; overflow: hidden; }
.engagement-card .findings-bar > div { height: 100%; }
.engagement-card .findings-bar .crit { background: var(--rose); }
.engagement-card .findings-bar .high { background: var(--amber); }
.engagement-card .findings-bar .med { background: var(--gold); }
.engagement-card .findings-bar .low { background: var(--sapphire); }
.engagement-card .findings-bar .ok { background: var(--emerald); }
.engagement-card .findings-legend { display: flex; gap: 14px; font-size: 11px; color: var(--fg-faint); margin-top: 6px; letter-spacing: 0.3px; }
.engagement-card .findings-legend .count-crit { color: var(--rose); font-weight: 600; }
.engagement-card .findings-legend .count-high { color: var(--amber); font-weight: 600; }
.engagement-card .findings-legend .count-med { color: var(--gold); font-weight: 600; }
.engagement-card .findings-legend .count-ok { color: var(--emerald); font-weight: 600; }
.engagement-card .card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule);
}
.engagement-card .metric { display: flex; gap: 16px; font-size: 11px; color: var(--fg-faint); letter-spacing: 0.3px; }
.engagement-card .metric strong { color: var(--fg); font-weight: 600; }
.engagement-card .drill { color: var(--gold); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════════════
   STATUS BADGES
   ═══════════════════════════════════════════════════════════════════════ */
.badge-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 2px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; border: 1px solid;
}
.badge-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
.status-scoped     { color: var(--fg-dim); border-color: var(--rule-strong); }               .status-scoped::before     { background: var(--fg-dim); }
.status-authorized { color: var(--sapphire); border-color: var(--sapphire-dim); }            .status-authorized::before { background: var(--sapphire); }
.status-planning   { color: var(--sapphire); border-color: var(--sapphire-dim); }            .status-planning::before   { background: var(--sapphire); }
.status-ready      { color: var(--gold); border-color: var(--gold-dim); }                    .status-ready::before      { background: var(--gold); }
.status-running    { color: var(--amber); border-color: var(--amber-dim); }                  .status-running::before    { background: var(--amber); animation: pulse 2s infinite; }
.status-evidence   { color: var(--amber); border-color: var(--amber-dim); }                  .status-evidence::before   { background: var(--amber); }
.status-shipped    { color: var(--emerald); border-color: var(--emerald-dim); }              .status-shipped::before    { background: var(--emerald); }
.status-aborted    { color: var(--rose); border-color: var(--rose-dim); }                    .status-aborted::before    { background: var(--rose); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.pill {
  display: inline-flex; padding: 2px 8px; border-radius: 2px;
  font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  border: 1px solid;
}
.pill.crit { color: var(--rose); border-color: var(--rose-dim); }
.pill.high { color: var(--amber); border-color: var(--amber-dim); }
.pill.med  { color: var(--gold); border-color: var(--gold-dim); }
.pill.low  { color: var(--sapphire); border-color: var(--sapphire-dim); }
.pill.ok   { color: var(--emerald); border-color: var(--emerald-dim); }
.pill.neutral { color: var(--fg-dim); border-color: var(--rule-strong); }

/* ═══════════════════════════════════════════════════════════════════════
   DETAIL HERO
   ═══════════════════════════════════════════════════════════════════════ */
.detail-hero {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 40px 44px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.detail-hero::before {
  content: ""; position: absolute; top: 0; right: 0;
  width: 220px; height: 220px;
  background: radial-gradient(circle at top right, rgba(252, 211, 77, 0.08) 0%, transparent 65%);
  pointer-events: none;
}
.detail-hero-content { position: relative; z-index: 1; }
.detail-hero .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; margin-bottom: 10px; }
.detail-hero h1 {
  font-family: var(--font-serif); font-size: 36px; color: var(--fg);
  font-weight: 700; letter-spacing: 2px; line-height: 1.15;
}
.detail-hero .theme { color: var(--fg-dim); font-size: 14px; margin-top: 14px; max-width: 720px; line-height: 1.65; }
.detail-hero .meta-row {
  display: flex; flex-wrap: wrap; gap: 24px;
  margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--rule);
}
.detail-hero .meta-row .item .label { color: var(--fg-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
.detail-hero .meta-row .item .value { font-size: 13px; color: var(--fg); margin-top: 4px; font-weight: 500; }
.detail-hero .meta-row .item .value.mono { font-family: var(--font-mono); font-size: 11.5px; }

/* ═══════════════════════════════════════════════════════════════════════
   PANELS
   ═══════════════════════════════════════════════════════════════════════ */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 24px 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.panel h3 {
  font-family: var(--font-serif); font-size: 15px; color: var(--gold);
  letter-spacing: 2px; font-weight: 600; margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid var(--rule);
  text-transform: uppercase;
}
.panel h3 .count {
  font-family: var(--font-mono); font-weight: 400; color: var(--fg-faint);
  margin-left: 6px; text-transform: none; letter-spacing: 0;
}
.two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

.takeaway {
  border: 1px solid; border-left-width: 4px;
  border-radius: 4px; padding: 20px 24px; margin-bottom: 20px;
  display: flex; gap: 18px; align-items: flex-start;
  background: var(--bg-card); box-shadow: var(--shadow);
}
.takeaway.crit { border-color: var(--rose-dim); border-left-color: var(--rose); background: linear-gradient(90deg, rgba(239, 68, 68, 0.06) 0%, var(--bg-card) 50%); }
.takeaway.high { border-color: var(--amber-dim); border-left-color: var(--amber); background: linear-gradient(90deg, rgba(245, 158, 11, 0.06) 0%, var(--bg-card) 50%); }
.takeaway.med { border-color: var(--gold-dim); border-left-color: var(--gold); background: linear-gradient(90deg, rgba(252, 211, 77, 0.06) 0%, var(--bg-card) 50%); }
.takeaway.low { border-color: var(--sapphire-dim); border-left-color: var(--sapphire); background: linear-gradient(90deg, rgba(96, 165, 250, 0.05) 0%, var(--bg-card) 50%); }
.takeaway.ok { border-color: var(--emerald-dim); border-left-color: var(--emerald); background: linear-gradient(90deg, rgba(52, 211, 153, 0.06) 0%, var(--bg-card) 50%); }
.takeaway .icon { font-family: var(--font-serif); font-size: 26px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
.takeaway.crit .icon, .takeaway.high .icon { color: var(--rose); }
.takeaway.med .icon { color: var(--gold); }
.takeaway.low .icon { color: var(--sapphire); }
.takeaway.ok .icon { color: var(--emerald); }
.takeaway .body h4 {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  color: var(--fg-faint); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
}
.takeaway .body p { color: var(--fg); font-size: 14.5px; line-height: 1.55; font-weight: 500; }

.summary-panel {
  background: var(--bg-card); border: 1px solid var(--rule); border-radius: 4px;
  padding: 28px 32px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.summary-panel h3 {
  font-family: var(--font-serif); font-size: 15px; color: var(--gold);
  letter-spacing: 2px; font-weight: 600; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid var(--rule); text-transform: uppercase;
}
.summary-panel .prose { color: var(--fg-dim); font-size: 13.5px; line-height: 1.8; }
.summary-panel .prose p { margin-bottom: 12px; }
.summary-panel .prose p:last-child { margin-bottom: 0; }

/* ═══════════════════════════════════════════════════════════════════════
   FINDINGS SUMMARY
   ═══════════════════════════════════════════════════════════════════════ */
.findings-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.findings-summary .card {
  background: var(--bg-sunk); border: 1px solid var(--rule);
  border-radius: 3px; padding: 16px 14px; text-align: center;
}
.findings-summary .card .count {
  font-family: var(--font-serif); font-size: 32px;
  font-weight: 700; letter-spacing: 1px; line-height: 1;
}
.findings-summary .card .label {
  color: var(--fg-faint); font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; margin-top: 8px; font-weight: 500;
}
.findings-summary .card.crit { border-color: var(--rose-dim); }
.findings-summary .card.crit .count { color: var(--rose); }
.findings-summary .card.high { border-color: var(--amber-dim); }
.findings-summary .card.high .count { color: var(--amber); }
.findings-summary .card.med { border-color: var(--gold-dim); }
.findings-summary .card.med .count { color: var(--gold); }
.findings-summary .card.low { border-color: var(--sapphire-dim); }
.findings-summary .card.low .count { color: var(--sapphire); }
.findings-summary .card.total { background: var(--bg-elev); border-color: var(--rule-strong); }
.findings-summary .card.total .count { color: var(--fg); }

/* ═══════════════════════════════════════════════════════════════════════
   SCORECARD HEATMAP
   ═══════════════════════════════════════════════════════════════════════ */
.scorecard-pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.scorecard-pillar {
  background: var(--bg-sunk); border: 1px solid var(--rule);
  border-radius: 3px; padding: 14px;
}
.scorecard-pillar h4 {
  font-family: var(--font-serif); font-size: 11px; text-transform: uppercase;
  color: var(--gold); letter-spacing: 1.5px; font-weight: 600; margin-bottom: 12px;
}
.dim-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px;
  align-items: center; padding: 5px 0; font-size: 11px;
}
.dim-row + .dim-row { border-top: 1px solid var(--rule); }
.dim-row .name { color: var(--fg); font-weight: 500; }
.dim-row .level {
  min-width: 28px; text-align: center; padding: 2px 6px;
  font-family: var(--font-mono); font-weight: 700; font-size: 10px;
  border-radius: 2px; letter-spacing: 0.5px; border: 1px solid;
}
.level-L0 { color: var(--rose); border-color: var(--rose-dim); background: rgba(239, 68, 68, 0.08); }
.level-L1 { color: var(--amber); border-color: var(--amber-dim); background: rgba(245, 158, 11, 0.08); }
.level-L2 { color: var(--gold); border-color: var(--gold-dim); background: rgba(252, 211, 77, 0.06); }
.level-L3 { color: var(--sapphire); border-color: var(--sapphire-dim); background: rgba(96, 165, 250, 0.06); }
.level-L4 { color: var(--emerald); border-color: var(--emerald-dim); background: rgba(52, 211, 153, 0.08); }
.level-L5 { color: var(--gold); border-color: var(--gold); background: rgba(252, 211, 77, 0.12); }
.dim-row .arrow { font-size: 10px; color: var(--fg-faint); letter-spacing: 0.3px; }
.dim-row .arrow.up { color: var(--emerald); }
.dim-row .arrow.down { color: var(--rose); }

/* ═══════════════════════════════════════════════════════════════════════
   SCENARIO ROW
   ═══════════════════════════════════════════════════════════════════════ */
.scenario-list { display: flex; flex-direction: column; gap: 8px; }
.scenario-row {
  background: var(--bg-sunk); border: 1px solid var(--rule);
  border-radius: 3px; padding: 16px 20px; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
  transition: border-color 0.15s, transform 0.1s;
}
.scenario-row:hover { border-color: var(--gold-dim); transform: translateX(3px); }
.scenario-row .verdict-badge {
  min-width: 92px; padding: 5px 8px; border-radius: 2px;
  font-size: 10px; font-weight: 700; text-align: center;
  text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid;
}
.scenario-row .verdict-badge.confirmed { color: var(--rose); border-color: var(--rose-dim); background: rgba(239, 68, 68, 0.08); }
.scenario-row .verdict-badge.high { color: var(--amber); border-color: var(--amber-dim); background: rgba(245, 158, 11, 0.06); }
.scenario-row .verdict-badge.medium, .scenario-row .verdict-badge.med { color: var(--gold); border-color: var(--gold-dim); }
.scenario-row .verdict-badge.low { color: var(--sapphire); border-color: var(--sapphire-dim); }
.scenario-row .verdict-badge.clean { color: var(--emerald); border-color: var(--emerald-dim); background: rgba(52, 211, 153, 0.06); }
.scenario-row .verdict-badge.inconclusive { color: var(--fg-dim); border-color: var(--rule-strong); }
.scenario-row .body h4 { font-family: var(--font-serif); font-size: 15px; color: var(--fg); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
.scenario-row .body .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-faint); letter-spacing: 0.3px; }
.scenario-row .arrow { color: var(--fg-faint); font-size: 18px; font-family: var(--font-serif); }
.scenario-row:hover .arrow { color: var(--gold); }

/* ═══════════════════════════════════════════════════════════════════════
   FINDING CARDS + ARTIFACTS
   ═══════════════════════════════════════════════════════════════════════ */
.finding-card {
  border: 1px solid var(--rule); border-left-width: 3px;
  border-radius: 3px; padding: 16px 20px; margin-bottom: 10px;
  background: var(--bg-sunk);
}
.finding-card.crit { border-left-color: var(--rose); }
.finding-card.high { border-left-color: var(--amber); }
.finding-card.med  { border-left-color: var(--gold); }
.finding-card.low  { border-left-color: var(--sapphire); }
.finding-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.finding-card .head h4 {
  font-family: var(--font-mono); font-size: 12px; color: var(--gold);
  font-weight: 600; letter-spacing: 0.3px;
}
.finding-card .detail { color: var(--fg); font-size: 13px; line-height: 1.6; }
.finding-card .evidence { margin-top: 10px; }
.finding-card .evidence pre {
  background: var(--bg); border: 1px solid var(--rule); padding: 10px 12px;
  border-radius: 3px; font-family: var(--font-mono); font-size: 11px;
  color: var(--fg-dim); overflow-x: auto;
}

.artifact-list { display: flex; flex-direction: column; gap: 6px; }
.artifact-row {
  background: var(--bg-sunk); border: 1px solid var(--rule);
  border-radius: 3px; padding: 10px 14px; font-size: 12px;
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
}
.artifact-row .kind {
  font-family: var(--font-mono); font-size: 10px; padding: 2px 7px;
  border: 1px solid var(--rule-strong); border-radius: 2px;
  color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
}
.artifact-row .path { font-family: var(--font-mono); font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artifact-row .size { color: var(--fg-faint); font-size: 11px; font-family: var(--font-mono); }
.artifact-row .hash { color: var(--fg-veil); font-size: 10px; font-family: var(--font-mono); }

/* ═══════════════════════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════════════════════ */
.footer {
  border-top: 1px solid var(--rule); padding: 20px 40px;
  color: var(--fg-veil); font-family: var(--font-mono); font-size: 10px;
  text-align: center; letter-spacing: 1px;
}
.footer .glyph { color: var(--gold); font-family: var(--font-serif); }
.footer a { color: var(--fg-dim); }

/* ═══════════════════════════════════════════════════════════════════════
   STATE + ROUTING
   ═══════════════════════════════════════════════════════════════════════ */
const STATE = { view: 'home', engagementId: null, scenarioId: null };

function parseHash() {
  const h = window.location.hash.slice(1);
  if (!h || h === '/') return { view: 'home' };
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'e' && parts[1] && parts[2] === 's' && parts[3]) {
    return { view: 'scenario', engagementId: parts[1], scenarioId: parts[3] };
  }
  if (parts[0] === 'e' && parts[1]) return { view: 'engagement', engagementId: parts[1] };
  return { view: 'home' };
}
function navigate(path) { window.location.hash = path.replace(/^#/, ''); }
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

/* ═══════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024*1024*1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(1) + ' GB';
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function findingsTotal(f) { return (f.critical || 0) + (f.high || 0) + (f.medium || 0) + (f.low || 0); }
function severityKey(s) { return { critical: 'crit', crit: 'crit', high: 'high', medium: 'med', med: 'med', low: 'low', ok: 'ok' }[s] || 'neutral'; }

/* ═══════════════════════════════════════════════════════════════════════
   BREADCRUMB
   ═══════════════════════════════════════════════════════════════════════ */
function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const parsed = parseHash();
  let html = `<span class="crumb ${parsed.view === 'home' ? 'current' : ''}" onclick="navigate('#/')">Portfolio</span>`;
  if (parsed.view === 'engagement' || parsed.view === 'scenario') {
    const eng = KRONOS_DATA.engagements.find((e) => e.id === parsed.engagementId);
    if (eng) {
      html += '<span class="sep">›</span>';
      html += `<span class="crumb ${parsed.view === 'engagement' ? 'current' : ''}" onclick="navigate('#/e/${esc(eng.id)}')">${esc(eng.target_display)}</span>`;
      if (parsed.view === 'scenario') {
        const sc = eng.scenarios.find((s) => s.id === parsed.scenarioId);
        if (sc) {
          html += '<span class="sep">›</span>';
          html += `<span class="crumb current">${esc(sc.id)}: ${esc(sc.name.slice(0, 60))}${sc.name.length > 60 ? '…' : ''}</span>`;
        }
      }
    }
  }
  el.innerHTML = html;
}

function renderScorecardPillar(title, dims) {
  return `
    <div class="scorecard-pillar">
      <h4>${esc(title)}</h4>
      ${Object.entries(dims).map(([dim, val]) => {
        const dirn = val.before === val.after ? '=' : (val.after > val.before ? '↑' : '↓');
        const dirClass = val.before === val.after ? '' : (val.after > val.before ? 'up' : 'down');
        return `
          <div class="dim-row">
            <span class="name">${esc(dim.replace(/_/g, ' '))}</span>
            <span class="level level-${esc(val.after)}">${esc(val.after)}</span>
            <span class="arrow ${dirClass}">${dirn}${val.before === val.after ? '' : ' from ' + esc(val.before)}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

}
