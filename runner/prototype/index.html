<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronos User Assurance Dashboard — prototype</title>
<style>
  :root {
    --bg: #0e1116;
    --bg-panel: #161b22;
    --bg-elev: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --ok: #3fb950;
    --low: #d29922;
    --med: #db6d28;
    --high: #f85149;
    --crit: #ff5555;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  header h1 .subtitle {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 13px;
    margin-left: 12px;
  }
  header .data-source {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-mono);
  }
  header .load-btn {
    background: var(--accent-dim);
    color: white;
    border: 1px solid var(--accent);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header .load-btn:hover { background: var(--accent); }
  #app { flex: 1; display: flex; overflow: hidden; }
  #sidebar {
    width: 280px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  #sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-faint);
    padding: 0 20px 8px;
  }
  .user-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s;
  }
  .user-item:hover { background: var(--bg-elev); }
  .user-item.active { background: var(--bg-elev); border-left-color: var(--accent); }
  .user-item .name { font-weight: 500; }
  .user-item .username { color: var(--text-dim); font-size: 12px; font-family: var(--font-mono); }
  .user-item .anomaly-count {
    display: inline-block;
    background: var(--high);
    color: white;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
  }
  .user-item .anomaly-count.none { background: var(--ok); }
  .user-item .anomaly-count.med { background: var(--med); }
  .user-item .anomaly-count.low { background: var(--low); }
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 80px 20px;
  }
  .user-header {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .user-header h2 {
    font-size: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-header h2 .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--ok);
    color: white;
  }
  .user-header h2 .badge.inactive { background: var(--text-faint); }
  .user-header .meta {
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 4px;
  }
  .user-header .kpi-row {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .kpi {
    background: var(--bg-elev);
    padding: 12px 16px;
    border-radius: 6px;
    min-width: 120px;
  }
  .kpi .label { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .kpi.high .value { color: var(--high); }
  .kpi.med .value { color: var(--med); }
  .kpi.low .value { color: var(--low); }
  .kpi.ok .value { color: var(--ok); }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    display: inline-block;
    background: var(--bg-elev);
    color: var(--text-dim);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .tab .badge.anomalous {
    background: var(--high);
    color: white;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 15px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .card h4 {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 16px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .anomaly {
    background: var(--bg-elev);
    padding: 12px 14px;
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 4px solid var(--text-faint);
    cursor: pointer;
  }
  .anomaly:hover { background: var(--bg); }
  .anomaly.crit { border-left-color: var(--crit); }
  .anomaly.high { border-left-color: var(--high); }
  .anomaly.med { border-left-color: var(--med); }
  .anomaly.low { border-left-color: var(--low); }
  .anomaly .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .anomaly .severity {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    background: var(--text-faint);
    color: white;
  }
  .anomaly.crit .severity { background: var(--crit); }
  .anomaly.high .severity { background: var(--high); }
  .anomaly.med .severity { background: var(--med); }
  .anomaly.low .severity { background: var(--low); }
  .anomaly .class-name {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
  }
  .anomaly .detail {
    color: var(--text);
    font-size: 13px;
  }
  .anomaly .evidence {
    margin-top: 6px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    display: none;
  }
  .anomaly.expanded .evidence { display: block; }
  .anomaly .evidence pre {
    background: var(--bg);
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin-bottom: 8px;
  }
  table th, table td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  table th {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    background: var(--bg-panel);
  }
  table td { font-family: var(--font-mono); font-size: 12px; }
  table td.strong { font-family: inherit; font-weight: 500; }
  table td.right { text-align: right; }
  table td.center { text-align: center; }
  .bit-yes { color: var(--ok); }
  .bit-no { color: var(--text-faint); }
  .missing { color: var(--text-faint); font-style: italic; }
  .scroll-cap {
    max-height: 400px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  details {
    background: var(--bg-elev);
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 12px;
  }
  details summary {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    user-select: none;
  }
  details[open] summary { color: var(--text); margin-bottom: 8px; }
  pre.json {
    background: var(--bg);
    padding: 10px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    overflow-x: auto;
    max-height: 300px;
    overflow-y: auto;
  }
  .role-chain {
    list-style: none;
    padding-left: 0;
  }
  .role-chain li {
    padding: 4px 0 4px 24px;
    border-left: 2px solid var(--border);
    margin-left: 8px;
    position: relative;
  }
  .role-chain li::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-faint);
  }
  .role-chain li.self::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2); }
  .role-chain li.self .role-name { color: var(--accent); font-weight: 600; }
  .tag {
    display: inline-block;
    background: var(--bg-elev);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-right: 4px;
    margin-top: 2px;
    font-family: var(--font-mono);
  }
  .tag.crit { background: var(--crit); color: white; }
  .tag.warn { background: var(--med); color: white; }
  footer {
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    padding: 6px 24px;
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>
<header>
  <h1>
    kronos
    <span class="subtitle">user assurance dashboard — prototype</span>
  </h1>
  <div style="display: flex; align-items: center; gap: 12px;">
    <div class="data-source" id="data-source-indicator">source: sample data</div>
    <input type="file" id="file-input" accept=".json" multiple style="display: none">
    <button class="load-btn" id="load-btn">Load analysis JSONs…</button>
  </div>
</header>

<div id="app">
  <aside id="sidebar">
    <h2>Users under assurance</h2>
    <div id="user-list"></div>
  </aside>
  <main id="main">
    <div class="empty-state" id="empty-state">Select a user from the sidebar to drill into their assurance profile.</div>
    <div id="user-view" style="display: none"></div>
  </main>
</div>

<footer>
  <div>kronos v0.1 — prototype dashboard for the future runner/</div>
  <div id="footer-meta">no data loaded</div>
</footer>

function loadSampleData() {

  STATE.analyses = [...SAMPLE_DATA.analyses];
  STATE.source = 'sample';
  document.getElementById('data-source-indicator').textContent = 'source: sample data (2 users, 8 analyses)';
  document.getElementById('footer-meta').textContent = `sample data · ${STATE.users.length} users · ${STATE.analyses.length} analyses`;
  renderUserList();
  if (STATE.users.length) selectUser(STATE.users[0].id);
}

function loadFromFiles(fileList) {
  const reads = [];
  for (const file of fileList) {
    reads.push(file.text().then((txt) => {
      try {
        const data = JSON.parse(txt);
        const kind = data.kronos_analysis_kind || detectKindFromFilename(file.name);
        if (!kind) throw new Error(`no kronos_analysis_kind and unknown filename pattern: ${file.name}`);
        data.kronos_analysis_kind = kind;
        return { ok: true, data, filename: file.name };
      } catch (e) {
        return { ok: false, filename: file.name, error: e.message };
      }
    }));
  }
  Promise.all(reads).then((results) => {
    const analyses = [];
    const users = new Map();
    let errors = [];
    for (const r of results) {
      if (!r.ok) { errors.push(`${r.filename}: ${r.error}`); continue; }
      const d = r.data;
      analyses.push(d);
      if (d.user && d.user.id) {
        const existing = users.get(d.user.id) ?? {};
        users.set(d.user.id, { ...existing, ...d.user });
      }
    }
    STATE.analyses = analyses;
    STATE.users = [...users.values()];
    STATE.source = 'loaded';
    document.getElementById('data-source-indicator').textContent = `source: ${fileList.length} loaded file(s)`;
    document.getElementById('footer-meta').textContent = `loaded · ${STATE.users.length} users · ${STATE.analyses.length} analyses${errors.length ? ` · ${errors.length} error(s)` : ''}`;
    if (errors.length) console.warn('Load errors:', errors);
    renderUserList();
    if (STATE.users.length) selectUser(STATE.users[0].id);
  });
}

function detectKindFromFilename(name) {
  const patterns = [
    ['permissions', 'user-permissions'],
    ['loginhistory', 'user-loginhistory'],
    ['login-history', 'user-loginhistory'],
    ['shares', 'user-shares'],
    ['group-membership', 'user-group-membership'],
    ['group', 'user-group-membership'],
    ['connected-apps', 'user-connected-apps'],
    ['audit-trail', 'user-audit-trail'],
  ];
  const lower = name.toLowerCase();
  for (const [pat, kind] of patterns) {
    if (lower.includes(pat)) return kind;
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════════════════
   USER-LIST SIDEBAR
   ═══════════════════════════════════════════════════════════════════════ */

function anomalyCountFor(userId) {
  return STATE.analyses
    .filter((a) => a.user && a.user.id === userId)
    .reduce((n, a) => n + (a.anomalies ? a.anomalies.length : 0), 0);
}

function highestSeverityFor(userId) {
  const sevOrder = { critical: 4, high: 3, medium: 2, low: 1 };
  let maxSev = 0;
  for (const a of STATE.analyses) {
    if (!a.user || a.user.id !== userId) continue;
    for (const an of a.anomalies || []) maxSev = Math.max(maxSev, sevOrder[an.severity] || 0);
  }
  return ['none', 'low', 'med', 'high', 'crit'][maxSev];
}

function renderUserList() {
  const el = document.getElementById('user-list');
  if (!STATE.users.length) {
    el.innerHTML = '<div style="padding: 12px 20px; color: var(--text-faint); font-size: 12px;">No users. Load analysis JSONs.</div>';
    return;
  }
  el.innerHTML = STATE.users.map((u) => {
    const count = anomalyCountFor(u.id);
    const sev = highestSeverityFor(u.id);
    const active = u.id === STATE.selectedUserId ? 'active' : '';
    return `
      <div class="user-item ${active}" data-user-id="${escapeHtml(u.id)}">
        <div class="name">${escapeHtml(u.name || u.username || u.id)}
          <span class="anomaly-count ${sev}">${count}</span>
        </div>
        <div class="username">${escapeHtml(u.username || '')}</div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.user-item').forEach((item) => {
    item.addEventListener('click', () => selectUser(item.dataset.userId));
  });
}

function selectUser(userId) {
  STATE.selectedUserId = userId;
  renderUserList();
  renderUserView();
}

  const analyses = STATE.analyses.filter((a) => a.user && a.user.id === user.id);
  const totalAnom = analyses.reduce((n, a) => n + (a.anomalies || []).length, 0);
  const critAnom = analyses.reduce((n, a) => n + (a.anomalies || []).filter((x) => x.severity === 'critical').length, 0);
  const highAnom = analyses.reduce((n, a) => n + (a.anomalies || []).filter((x) => x.severity === 'high').length, 0);
  const medAnom = analyses.reduce((n, a) => n + (a.anomalies || []).filter((x) => x.severity === 'medium').length, 0);
  const lowAnom = analyses.reduce((n, a) => n + (a.anomalies || []).filter((x) => x.severity === 'low').length, 0);

  view.innerHTML = `
    <div class="user-header">
      <h2>
        ${escapeHtml(user.name || user.username || user.id)}
        <span class="badge ${user.is_active === false ? 'inactive' : ''}">${user.is_active === false ? 'INACTIVE' : 'ACTIVE'}</span>
      </h2>
      <div class="meta">
        ${escapeHtml(user.username || '—')} · Id <code>${escapeHtml(user.id)}</code>
        ${user.profile_name ? ` · Profile: ${escapeHtml(user.profile_name)}` : ''}
        ${user.user_role_name ? ` · Role: ${escapeHtml(user.user_role_name)}` : ''}
      </div>
      <div class="kpi-row">
        <div class="kpi ${totalAnom ? 'high' : 'ok'}"><div class="label">Anomalies total</div><div class="value">${totalAnom}</div></div>
        <div class="kpi ${critAnom ? 'high' : 'ok'}"><div class="label">Critical</div><div class="value">${critAnom}</div></div>
        <div class="kpi ${highAnom ? 'med' : 'ok'}"><div class="label">High</div><div class="value">${highAnom}</div></div>
        <div class="kpi ${medAnom ? 'low' : 'ok'}"><div class="label">Medium</div><div class="value">${medAnom}</div></div>
        <div class="kpi ok"><div class="label">Low</div><div class="value">${lowAnom}</div></div>
        <div class="kpi ok"><div class="label">Dimensions loaded</div><div class="value">${analyses.length}</div></div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab ${STATE_VIEW.activeTab === 'overview' ? 'active' : ''}" data-tab="overview">Overview</button>
      ${Object.keys(DIMENSION_META).map((kind) => {
        const a = analyses.find((x) => x.kronos_analysis_kind === kind);
        if (!a) return '';
        const anoms = (a.anomalies || []).length;
        return `<button class="tab ${STATE_VIEW.activeTab === kind ? 'active' : ''}" data-tab="${kind}">
          ${DIMENSION_META[kind].icon} ${DIMENSION_META[kind].label}
          <span class="badge ${anoms ? 'anomalous' : ''}">${anoms}</span>
        </button>`;
      }).join('')}
    </div>

    <div id="tab-body"></div>
  `;

  view.querySelectorAll('.tab').forEach((tabEl) => {
    tabEl.addEventListener('click', () => {
      STATE_VIEW.activeTab = tabEl.dataset.tab;
      renderUserView();
    });
  });

  renderTabBody(user, analyses);
}

function renderTabBody(user, analyses) {
  const body = document.getElementById('tab-body');
  if (STATE_VIEW.activeTab === 'overview') {
    body.innerHTML = renderOverview(user, analyses);
    wireAnomalies(body);
    return;
  }
  const a = analyses.find((x) => x.kronos_analysis_kind === STATE_VIEW.activeTab);
  if (!a) { body.innerHTML = '<div class="empty-state">No analysis loaded for this dimension.</div>'; return; }
  switch (a.kronos_analysis_kind) {
    case 'user-permissions':      body.innerHTML = renderPermissions(a); break;
    case 'user-loginhistory':     body.innerHTML = renderLoginHistory(a); break;
    case 'user-shares':           body.innerHTML = renderShares(a); break;
    case 'user-group-membership': body.innerHTML = renderGroupMembership(a); break;
    case 'user-connected-apps':   body.innerHTML = renderConnectedApps(a); break;
    case 'user-audit-trail':      body.innerHTML = renderAuditTrail(a); break;
    default:                      body.innerHTML = `<div class="card"><h3>Raw analysis JSON</h3><pre class="json">${escapeHtml(JSON.stringify(a, null, 2))}</pre></div>`;
  }
  wireAnomalies(body);
}

function renderOverview(user, analyses) {
  const allAnoms = [];
  for (const a of analyses) {
    for (const an of a.anomalies || []) {
      allAnoms.push({ ...an, source_kind: a.kronos_analysis_kind });
    }
  }
  allAnoms.sort((x, y) => {
    const so = { critical: 4, high: 3, medium: 2, low: 1 };
    return (so[y.severity] || 0) - (so[x.severity] || 0);
  });

  return `
    <div class="card">
      <h3>All anomalies across dimensions</h3>
      ${allAnoms.length === 0 ? '<div class="missing">No anomalies flagged.</div>' :
        allAnoms.map((an) => renderAnomaly(an, DIMENSION_META[an.source_kind]?.label ?? an.source_kind)).join('')}
    </div>
    <div class="card">
      <h3>Analyses loaded for this user</h3>
      <table>
        <thead><tr><th>Dimension</th><th>Tool</th><th>Version</th><th class="right">Anomalies</th><th>Generated</th></tr></thead>
        <tbody>
          ${analyses.map((a) => `
            <tr>
              <td class="strong">${DIMENSION_META[a.kronos_analysis_kind]?.icon ?? ''} ${DIMENSION_META[a.kronos_analysis_kind]?.label ?? a.kronos_analysis_kind}</td>
              <td>${escapeHtml(a.tool || '—')}</td>
              <td>${escapeHtml(a.tool_version || '—')}</td>
              <td class="right">${(a.anomalies || []).length}</td>
              <td>${escapeHtml(a.generated_at || '—')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderAnomaly(an, sourceLabel) {
  return `
    <div class="anomaly ${an.severity}" data-anomaly>
      <div class="header">
        <span class="severity">${an.severity}</span>
        <span class="class-name">${escapeHtml(an.class)}</span>
        ${sourceLabel ? `<span style="color: var(--text-faint); font-size: 12px;">· ${escapeHtml(sourceLabel)}</span>` : ''}
      </div>
      <div class="detail">${escapeHtml(an.detail)}</div>
      <div class="evidence">
        <pre>${escapeHtml(JSON.stringify(an.evidence || {}, null, 2))}</pre>
      </div>
    </div>
  `;
}

function wireAnomalies(root) {
  root.querySelectorAll('[data-anomaly]').forEach((el) => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });
}

/* ─── PERMISSIONS ────────────────────────────────────────────────── */
function renderPermissions(a) {
  const anoms = (a.anomalies || []).map((an) => renderAnomaly(an)).join('');
  const crits = (a.critical_permissions_effective || []).map((p) => `<span class="tag crit">${escapeHtml(p)}</span>`).join('');
  const psRows = ((a.permission_sources || {}).permissionsets || []).map((ps) => `
    <tr>
      <td class="strong">${escapeHtml(ps.parent_name)}</td>
      <td>${ps.is_custom ? '<span class="tag warn">custom</span>' : ''}${ps.is_namespaced ? '<span class="tag">namespaced</span>' : ''}</td>
      <td class="right">${(ps.critical_permissions_true || []).length}</td>
      <td>${(ps.critical_permissions_true || []).map((p) => `<code style="font-size:11px">${escapeHtml(p)}</code>`).join(', ') || '—'}</td>
    </tr>
  `).join('');
  const opRows = (a.effective_object_permissions || []).map((op) => `
    <tr>
      <td class="strong">${escapeHtml(op.sobject)}</td>
      <td class="center">${op.read ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="center">${op.create ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="center">${op.edit ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="center">${op.delete ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="center">${op.view_all_records ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="center">${op.modify_all_records ? '<span class="bit-yes">✔</span>' : '<span class="bit-no">·</span>'}</td>
      <td class="right">${(op.sources || []).length}</td>
    </tr>
  `).join('');
  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <h3>Critical permissions effective (${(a.critical_permissions_effective || []).length})</h3>
      ${crits || '<div class="missing">No critical flags set.</div>'}
    </div>
    <div class="card">
      <h3>Permission sources</h3>
      <h4>Profile: ${escapeHtml((a.permission_sources || {}).profile?.parent_name ?? '—')}</h4>
      ${((a.permission_sources || {}).profile?.critical_permissions_true || []).map((p) => `<code style="font-size:11px">${escapeHtml(p)}</code>`).join(', ') || '<span class="missing">no tracked critical permissions granted by profile</span>'}
      <h4>PermissionSets (${((a.permission_sources || {}).permissionsets || []).length})</h4>
      <table><thead><tr><th>Name</th><th>Flags</th><th class="right">Critical count</th><th>Critical granted here</th></tr></thead>
      <tbody>${psRows || '<tr><td colspan="4"><span class="missing">No PSs assigned.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Effective object permissions (${(a.effective_object_permissions || []).length} sobjects)</h3>
      <div class="scroll-cap">
        <table><thead><tr><th>Sobject</th><th class="center">R</th><th class="center">C</th><th class="center">E</th><th class="center">D</th><th class="center">ViewAll</th><th class="center">ModAll</th><th class="right">Src</th></tr></thead>
        <tbody>${opRows || '<tr><td colspan="8"><span class="missing">None.</span></td></tr>'}</tbody></table>
      </div>
    </div>
    ${renderRawDetail(a)}
  `;
}

/* ─── LOGIN HISTORY ─────────────────────────────────────────────── */
function renderLoginHistory(a) {
  const anoms = (a.anomalies || []).map((an) => renderAnomaly(an)).join('');
  const w = a.window || {};
  const geo = (a.geography?.countries || []).map((c) => `
    <tr><td>${escapeHtml(c.country || '—')}</td><td>${escapeHtml(c.country_iso)}</td><td class="right">${c.count}</td></tr>
  `).join('');
  const ips = (a.network?.top_source_ips || []).slice(0, 15).map((ip) => `
    <tr><td>${escapeHtml(ip.source_ip)}</td><td class="right">${ip.count}</td></tr>
  `).join('');
  const tls = Object.entries(a.channel?.tls_protocol_counts || {}).map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td class="right">${v}</td></tr>`).join('');
  const apps = Object.entries(a.channel?.application_counts || {}).sort((x, y) => y[1] - x[1]).slice(0, 10).map(([k, v]) => `<tr><td>${escapeHtml(k)}</td><td class="right">${v}</td></tr>`).join('');
  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <h3>Window</h3>
      <div class="kpi-row">
        <div class="kpi"><div class="label">Total logins</div><div class="value">${w.total_logins ?? '—'}</div></div>
        <div class="kpi"><div class="label">Span (days)</div><div class="value">${w.span_days ?? '—'}</div></div>
        <div class="kpi ${a.outcomes?.failure_count ? 'med' : 'ok'}"><div class="label">Failures</div><div class="value">${a.outcomes?.failure_count ?? 0}</div></div>
        <div class="kpi ${a.geography?.unique_country_count > 1 ? 'high' : 'ok'}"><div class="label">Countries</div><div class="value">${a.geography?.unique_country_count ?? '—'}</div></div>
        <div class="kpi ${a.network?.unique_source_ip_count >= 10 ? 'med' : 'ok'}"><div class="label">Source IPs</div><div class="value">${a.network?.unique_source_ip_count ?? '—'}</div></div>
      </div>
      <p style="margin-top: 12px; color: var(--text-dim); font-size: 12px;">
        Earliest: <code>${escapeHtml(w.earliest_login || '—')}</code> · Latest: <code>${escapeHtml(w.latest_login || '—')}</code>
      </p>
    </div>
    <div class="card">
      <h3>Geography</h3>
      <table><thead><tr><th>Country</th><th>ISO</th><th class="right">Logins</th></tr></thead>
      <tbody>${geo || '<tr><td colspan="3"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Top source IPs</h3>
      <table><thead><tr><th>IP</th><th class="right">Count</th></tr></thead>
      <tbody>${ips || '<tr><td colspan="2"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>TLS protocols observed</h3>
      <table><thead><tr><th>Protocol</th><th class="right">Count</th></tr></thead>
      <tbody>${tls || '<tr><td colspan="2"><span class="missing">None.</span></td></tr>'}</tbody></table>
      <h4>Top applications</h4>
      <table><thead><tr><th>App</th><th class="right">Count</th></tr></thead>
      <tbody>${apps || '<tr><td colspan="2"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    ${renderRawDetail(a)}
  `;
}

/* ─── SHARES ─────────────────────────────────────────────────────── */
function renderShares(a) {
  const anoms = (a.anomalies || []).map((an) => renderAnomaly(an)).join('');
  const chain = (a.role_hierarchy?.chain_ascending || []).map((r) => `
    <li class="${r.depth_from_target === 0 ? 'self' : ''}"><span class="role-name">${escapeHtml(r.name)}</span>
      <span style="color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; margin-left: 8px;">${escapeHtml(r.id)}</span></li>
  `).join('');
  const groups = (a.groups?.direct_memberships || []).map((g) => `
    <tr><td class="strong">${escapeHtml(g.name)}</td><td><span class="tag">${escapeHtml(g.type)}</span></td><td class="center">${g.does_include_bosses ? '✔' : ''}</td></tr>
  `).join('');
  const shares = (a.sobject_shares || []).map((s) => {
    const topCause = Object.entries(s.by_row_cause || {}).sort((x, y) => y[1] - x[1])[0];
    const topAccess = Object.entries(s.by_access_level || {}).sort((x, y) => y[1] - x[1])[0];
    return `<tr>
      <td class="strong">${escapeHtml(s.sobject)}</td>
      <td class="right">${s.share_row_count}</td>
      <td class="right">${s.unique_records_shared}</td>
      <td class="center">${s.truncated ? '<span class="tag warn">⚠</span>' : ''}</td>
      <td>${topCause ? `<code>${escapeHtml(topCause[0])}</code> (${topCause[1]})` : '—'}</td>
      <td>${topAccess ? `<code>${escapeHtml(topAccess[0])}</code> (${topAccess[1]})` : '—'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <h3>Role hierarchy — ascending chain</h3>
      <ul class="role-chain">${chain || '<li class="missing">User has no assigned role.</li>'}</ul>
      <p style="margin-top: 8px; color: var(--text-dim); font-size: 12px;">Subordinate roles beneath user: <strong>${a.role_hierarchy?.subordinate_count ?? 0}</strong></p>
    </div>
    <div class="card">
      <h3>Direct group memberships (${(a.groups?.direct_memberships || []).length})</h3>
      <table><thead><tr><th>Group</th><th>Type</th><th class="center">Bosses</th></tr></thead>
      <tbody>${groups || '<tr><td colspan="3"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Per-sobject shares (sampled)</h3>
      <table><thead><tr><th>Sobject</th><th class="right">Share rows</th><th class="right">Unique records</th><th class="center">Truncated</th><th>Top RowCause</th><th>Top AccessLevel</th></tr></thead>
      <tbody>${shares || '<tr><td colspan="6"><span class="missing">No shares queried.</span></td></tr>'}</tbody></table>
    </div>
    ${renderRawDetail(a)}
  `;
}

/* ─── GROUP MEMBERSHIP ─────────────────────────────────────────── */
function renderGroupMembership(a) {
  const anoms = (a.anomalies || []).map((an) => renderAnomaly(an)).join('');
  const direct = (a.direct_groups || []).map((g) => `<tr><td class="strong">${escapeHtml(g.name)}</td><td><span class="tag">${escapeHtml(g.type)}</span></td><td class="center">${g.does_include_bosses ? '✔' : ''}</td></tr>`).join('');
  const trans = (a.transitive_groups || []).map((g) => `<tr><td class="strong">${escapeHtml(g.name)}</td><td><span class="tag">${escapeHtml(g.type)}</span></td><td class="right">${g.depth}</td><td>${(g.reached_via || []).map((v) => `<code>${escapeHtml(v)}</code>`).join(', ')}</td></tr>`).join('');
  const queues = (a.queues?.queue_sobjects || []).map((qs) => `<tr><td>${escapeHtml(qs.queue_name)}</td><td><code>${escapeHtml(qs.sobject_type)}</code></td></tr>`).join('');
  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <div class="kpi-row">
        <div class="kpi"><div class="label">Direct groups</div><div class="value">${a.totals?.direct_group_count ?? 0}</div></div>
        <div class="kpi"><div class="label">Transitive</div><div class="value">${a.totals?.transitive_group_count ?? 0}</div></div>
        <div class="kpi ${(a.totals?.total_effective_group_count ?? 0) >= 30 ? 'med' : 'ok'}"><div class="label">Total effective</div><div class="value">${a.totals?.total_effective_group_count ?? 0}</div></div>
        <div class="kpi"><div class="label">Queues</div><div class="value">${a.totals?.queue_membership_count ?? 0}</div></div>
        <div class="kpi"><div class="label">Max depth</div><div class="value">${a.totals?.max_transitive_depth ?? 0}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Direct memberships (${(a.direct_groups || []).length})</h3>
      <table><thead><tr><th>Group</th><th>Type</th><th class="center">Bosses</th></tr></thead>
      <tbody>${direct || '<tr><td colspan="3"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Transitive memberships (${(a.transitive_groups || []).length})</h3>
      <table><thead><tr><th>Group</th><th>Type</th><th class="right">Depth</th><th>Reached via</th></tr></thead>
      <tbody>${trans || '<tr><td colspan="4"><span class="missing">No group nesting reaches this user.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Queue → Sobject map (${(a.queues?.queue_sobjects || []).length})</h3>
      <table><thead><tr><th>Queue</th><th>Sobject</th></tr></thead>
      <tbody>${queues || '<tr><td colspan="2"><span class="missing">Not in any queue.</span></td></tr>'}</tbody></table>
    </div>
    ${renderRawDetail(a)}
  `;
}

/* ─── CONNECTED APPS ──────────────────────────────────────────── */

    <tr>
      <td class="strong">${escapeHtml(app.app_name)}${app.is_dev_tool ? ' <span class="tag warn">dev tool</span>' : ''}</td>
      <td class="right">${app.token_count}</td>
      <td class="right">${app.total_use_count}</td>
      <td>${escapeHtml(app.most_recently_used || '—')}</td>
      <td>${escapeHtml(app.first_created || '—')}</td>

    <tr>
      <td>${escapeHtml(t.app_name)}</td>
      <td class="right">${t.use_count}</td>
      <td>${escapeHtml(t.last_used_date || '—')}</td>
      <td>${escapeHtml(t.created_date)}</td>

    <tr><td>${escapeHtml(l.provider_developer_name || '—')}</td><td>${escapeHtml(l.provider_type || '')}</td><td>${escapeHtml(l.remote_identifier)}</td><td class="center">${l.sso_used ? '✔' : ''}</td></tr>

  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <div class="kpi-row">
        <div class="kpi ${a.totals?.active_token_count >= 5 ? 'med' : 'ok'}"><div class="label">Active tokens</div><div class="value">${a.totals?.active_token_count ?? 0}</div></div>
        <div class="kpi"><div class="label">Distinct apps</div><div class="value">${a.totals?.distinct_app_count ?? 0}</div></div>
        <div class="kpi ${a.totals?.stale_token_count >= 3 ? 'med' : 'ok'}"><div class="label">Stale (&gt;90d)</div><div class="value">${a.totals?.stale_token_count ?? 0}</div></div>
        <div class="kpi ${a.totals?.never_used_token_count >= 3 ? 'med' : 'ok'}"><div class="label">Never used</div><div class="value">${a.totals?.never_used_token_count ?? 0}</div></div>
        <div class="kpi"><div class="label">Total UseCount</div><div class="value">${a.totals?.total_use_count_across_tokens ?? 0}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>By app (${(a.by_app || []).length})</h3>
      <table><thead><tr><th>App</th><th class="right">Tokens</th><th class="right">Total UseCount</th><th>Most recent use</th><th>First created</th></tr></thead>
      <tbody>${byApp || '<tr><td colspan="5"><span class="missing">No OAuth tokens.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>OAuth tokens (${(a.oauth_tokens || []).length})</h3>
      <div class="scroll-cap">
      <table><thead><tr><th>App</th><th class="right">Uses</th><th>Last used</th><th>Created</th></tr></thead>
      <tbody>${tokens || '<tr><td colspan="4"><span class="missing">None.</span></td></tr>'}</tbody></table>
      </div>
    </div>
    <div class="card">
      <h3>Third-party account links (${(a.third_party_links || []).length})</h3>
      <table><thead><tr><th>Provider</th><th>Type</th><th>Remote id</th><th class="center">SSO</th></tr></thead>
      <tbody>${links || '<tr><td colspan="4"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    ${renderRawDetail(a)}
  `;
}

/* ─── AUDIT TRAIL ─────────────────────────────────────────────── */
function renderAuditTrail(a) {
  const anoms = (a.anomalies || []).map((an) => renderAnomaly(an)).join('');
  const bySection = (a.by_section || []).slice(0, 15).map((s) => `
    <tr><td class="strong">${escapeHtml(s.section)}</td><td class="right">${s.count}</td><td class="center">${s.is_high_privilege ? '<span class="tag warn">⚠ HP</span>' : ''}</td></tr>
  `).join('');
  const byAction = (a.by_action || []).slice(0, 15).map((act) => `<tr><td>${escapeHtml(act.action)}</td><td class="right">${act.count}</td></tr>`).join('');
  const delegates = (a.delegate_activity?.delegates || []).map((d) => `<tr><td><code>${escapeHtml(d.delegate_username)}</code></td><td class="right">${d.count}</td></tr>`).join('');
  return `
    <div class="card">
      <h3>Anomalies (${(a.anomalies || []).length})</h3>
      ${anoms || '<div class="missing">None flagged.</div>'}
    </div>
    <div class="card">
      <div class="kpi-row">
        <div class="kpi"><div class="label">Total actions</div><div class="value">${a.window?.total_actions ?? 0}</div></div>
        <div class="kpi"><div class="label">Span (days)</div><div class="value">${a.window?.span_days ?? '—'}</div></div>
        <div class="kpi ${a.action_class_counts?.delete >= 20 ? 'high' : 'ok'}"><div class="label">Deletes</div><div class="value">${a.action_class_counts?.delete ?? 0}</div></div>
        <div class="kpi"><div class="label">Modifies</div><div class="value">${a.action_class_counts?.modify ?? 0}</div></div>
        <div class="kpi"><div class="label">Creates</div><div class="value">${a.action_class_counts?.create ?? 0}</div></div>
        <div class="kpi ${a.patterns?.weekend_action_count / (a.window?.total_actions || 1) > 0.15 ? 'med' : 'ok'}"><div class="label">Weekend</div><div class="value">${a.patterns?.weekend_action_count ?? 0}</div></div>
        <div class="kpi ${a.patterns?.off_hours_action_count / (a.window?.total_actions || 1) > 0.25 ? 'med' : 'ok'}"><div class="label">Off-hours</div><div class="value">${a.patterns?.off_hours_action_count ?? 0}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>By section (top 15)</h3>
      <table><thead><tr><th>Section</th><th class="right">Count</th><th class="center">High-priv</th></tr></thead>
      <tbody>${bySection || '<tr><td colspan="3"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Top actions (top 15)</h3>
      <table><thead><tr><th>Action</th><th class="right">Count</th></tr></thead>
      <tbody>${byAction || '<tr><td colspan="2"><span class="missing">None.</span></td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Delegate activity (${a.delegate_activity?.count ?? 0})</h3>
      <table><thead><tr><th>Delegate</th><th class="right">Count</th></tr></thead>
      <tbody>${delegates || '<tr><td colspan="2"><span class="missing">No delegate actions.</span></td></tr>'}</tbody></table>
    </div>
    ${renderRawDetail(a)}
  `;
}

function renderRawDetail(a) {
  return `
    <details>
      <summary>Show raw analysis JSON</summary>
      <pre class="json">${escapeHtml(JSON.stringify(a, null, 2))}</pre>
    </details>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════════════════════════ */

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

loadSampleData();
